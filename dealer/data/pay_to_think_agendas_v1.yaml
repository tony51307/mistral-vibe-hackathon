schema_version: '1.0'
problem_bank: pay_to_think_problem_bank_v1.json
default_season_rounds: 25
dealer_visibility_rule:
  agent_receives:
  - problem_id
  - category
  - prompt_markdown
  dealer_only:
  - answer
  - dealer_meta
  - dealer_difficulty
  - guessability
  - reference_reasoning_tier
  - round_role
  - strategy_number
  - objective
  - dynamic_advantage
dynamic_edge_strategy_notes:
  source_catalog_revision: '2.0'
  purpose: Showcase and stress-test the economic value of adaptive reasoning. Do not
    use these strategies alone as an unbiased benchmark.
  design_principles:
  - Make the marginal value of reasoning change sharply.
  - Tax always-high policies with cheap, high-prior questions.
  - Expose always-none policies with low-prior, hard questions.
  - Concentrate low/medium decision-boundary questions where dynamic routing can earn margin.
  - Order rounds so preserving capital matters later, not only per-question accuracy.
  - Pair showcase agendas with seeded mixed or random agendas for scientific claims.
