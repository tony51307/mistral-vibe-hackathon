- strategy_number: 7
  name: budget_then_battle
  showcase_bias: true
  objective: Give adaptive agents a chance to preserve/build bankroll on cheap rounds before a difficult late-game
    block where preserved capital can be converted into reasoning.
  dynamic_advantage:
  - 'The opening is deliberately cheap: high reasoning buys little but costs four extra dollars versus none.'
  - The middle moves through low/medium-value reasoning decisions.
  - The final block requires substantial reasoning, so agents that conserved capital can still afford high tiers.
  round_count: 25
  rounds:
  - round: 1
    problem_id: cs_001
