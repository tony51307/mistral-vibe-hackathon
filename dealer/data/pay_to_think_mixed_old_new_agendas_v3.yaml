schema_version: '3.0'
name: pay_to_think_mixed_old_new_agendas_v3
problem_banks:
  old_v1: pay_to_think_problem_bank_v1.json
  new_v2: pay_to_think_reasoning_sensitive_additions_v2.json
load_rule: Load both banks, build one dictionary keyed by problem id, assert no duplicate ids, then resolve each round
  by problem_id. source_bank is an audit field.
purpose: Showcase/stress-test agendas designed to create measurable margin for adaptive reasoning while retaining cheap/easy
  rounds that punish always-high.
agent_visibility_rule:
  show:
  - problem_id
  - category
  - prompt_markdown
  hide:
  - source_bank
  - dealer_difficulty
  - guessability
  - reasoning_profile
  - reference_reasoning_tier
  - strategy_number
  - objective
agendas:
