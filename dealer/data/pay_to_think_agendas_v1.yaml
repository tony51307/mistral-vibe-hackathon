- strategy_number: 9
  name: reasoning_tier_ladder
  showcase_bias: true
  objective: Create a broad middle where low/medium reasoning is economically useful; this is the cleanest test
    against both always-none and always-high.
  dynamic_advantage:
  - Five none-like rounds punish always-high.
  - Five low-like and ten medium-like rounds create the largest room for an adaptive margin.
  - Five high-like rounds ensure always-none cannot win simply by being cheap.
