- strategy_number: 6
  name: adaptive_sawtooth
  showcase_bias: true
  objective: Alternate cheap/high-prior rounds with expensive low-prior rounds so a static reasoning tier is repeatedly
    wrong.
  dynamic_advantage:
  - Always-high burns extra capital on trivial/easy rounds where marginal reasoning value is small.
  - Always-none is exposed immediately on hard/very-hard rounds.
  - Frequent switching rewards a router that can change effort problem by problem.
  round_count: 25
  rounds:
