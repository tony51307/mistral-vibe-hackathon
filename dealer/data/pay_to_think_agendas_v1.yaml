- strategy_number: 8
  name: guessability_traps
  showcase_bias: true
  objective: Separate true reasoning need from answer-prior/guessability effects; reward routers that detect instability
    instead of mapping surface difficulty directly to spend.
  dynamic_advantage:
  - Early high-guessability questions tempt cheap policies and can make expensive reasoning wasteful.
  - Low-guessability medium/hard questions then punish pure answer-prior gambling.
  - The final easy/trivial block tests whether the router can become cheap again after a difficult stretch.
